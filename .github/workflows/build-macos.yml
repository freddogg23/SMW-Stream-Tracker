name: Build macOS apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "SMWStreamTracker_MARIO_UI_STATS_CHARTS_MARIO_TIGHTER.py"
      - "SMWStreamTrackerLauncher.py"
      - "SMWStreamTracker-macOS.spec"
      - "release/build_macos_release.sh"
      - "release/requirements-macos.txt"
      - "app_assets/**"
      - "banner_background_assets/**"
      - "banner_character_assets/**"
      - "banner_character_assets_user/**"
      - "banner_foreground_assets/**"
      - "banner_title_assets/**"
      - "banner_element_assets/**"
      - "platform_assets/**"
      - "docs/**"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mac build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r release/requirements-macos.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests

      - name: Build signed-or-ad-hoc Mac app and DMG
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash release/build_macos_release.sh

      - name: Upload Mac build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMWStreamTracker-macOS-${{ matrix.architecture }}
          path: |
            dist/SMWStreamTracker_macOS_${{ matrix.architecture }}_*.dmg
            dist/SMWStreamTracker_macOS_${{ matrix.architecture }}_*.zip
            dist/SHA256SUMS_macOS_${{ matrix.architecture }}_*.txt
          if-no-files-found: error

      - name: Attach Mac downloads to the tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          for attempt in {1..40}; do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$tag" \
                dist/SMWStreamTracker_macOS_${{ matrix.architecture }}_*.dmg \
                dist/SMWStreamTracker_macOS_${{ matrix.architecture }}_*.zip \
                dist/SHA256SUMS_macOS_${{ matrix.architecture }}_*.txt \
                --repo "${{ github.repository }}" \
                --clobber
              exit 0
            fi
            sleep 15
          done
          echo "The Windows workflow did not create release $tag in time."
          exit 1

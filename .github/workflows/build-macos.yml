name: Build macOS apps (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mac build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r release/requirements-macos.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests

      - name: Build signed-or-ad-hoc Mac app and DMG
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash release/build_macos_release.sh

      - name: Upload Mac build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMWStreamTracker-macOS-${{ matrix.architecture }}
          path: |
            dist/SMWStreamTracker_macOS_${{ matrix.architecture }}_*.dmg
            dist/SMWStreamTracker_macOS_${{ matrix.architecture }}_*.zip
            dist/SHA256SUMS_macOS_${{ matrix.architecture }}_*.txt
          if-no-files-found: error
